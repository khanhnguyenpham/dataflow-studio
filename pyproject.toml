[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
files = ["backend/app/config.py", "backend/app/schema_match.py", "backend/app/transforms.py", "backend/app/aggregation.py"]
check_untyped_defs = true
follow_imports = "silent"
