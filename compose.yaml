services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: dataflow
      POSTGRES_USER: dataflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a unique URL-safe POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, pg_isready -U dataflow -d dataflow]
      interval: 3s
      timeout: 3s
      retries: 20
  app:
    build: .
    ports: ["127.0.0.1:8080:8000"]
    environment:
      DATABASE_URL: postgresql+psycopg://dataflow:${POSTGRES_PASSWORD}@db:5432/dataflow
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      APP_ORIGINS: ${APP_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    tmpfs: [/tmp]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 30
volumes:
  pgdata:
